server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Must be >= MAX_FILE_SIZE_MB in .env, otherwise uploads are rejected here
    # before the backend can enforce its own limit.
    client_max_body_size 30m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ^~ keeps the API prefix ahead of the static-asset regex below.
    location ^~ /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;

        # OVERWRITE the client address rather than appending: the backend only
        # trusts X-Forwarded-* from peers in TRUSTED_PROXY_PATTERN and rate
        # limits key off this value.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Summaries and chat can take a while on slower models.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Hashed Vite assets are immutable.
    location ~* \.(js|css|woff2?|ttf|svg|png|jpe?g|webp|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # SPA routes: let the client router handle unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

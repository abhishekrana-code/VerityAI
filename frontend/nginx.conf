server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Must be >= MAX_FILE_SIZE_MB in .env, otherwise uploads are rejected here
    # before the backend can enforce its own limit.
    client_max_body_size 30m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Inherited by every location below (none of them add headers of their own;
    # they use `expires`, which nginx turns into Cache-Control).
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # ^~ keeps the API prefix ahead of the static locations.
    location ^~ /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;

        # OVERWRITE the client address rather than appending: the backend only
        # trusts X-Forwarded-* from peers in TRUSTED_PROXY_PATTERN and rate
        # limits key off this value.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Summaries and chat can take a while on slower models.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Vite emits only content-hashed files here, so they can be cached hard.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA routes: let the client router handle unknown paths. index.html must
    # not be cached or deploys would keep serving the old bundle.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}

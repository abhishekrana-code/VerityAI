server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SERVER_SERVLET_SESSION_COOKIE_SECURE:false}
        same-site: ${SERVER_SERVLET_SESSION_COOKIE_SAME_SITE:lax}
      timeout: ${SERVER_SERVLET_SESSION_TIMEOUT:30m}

spring:
  application:
    name: verityai
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://localhost:5434/verityai
    username: verityai
    password: verityai_dev
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 30000
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  session:
    jdbc:
      initialize-schema: never
    store-type: ${SPRING_SESSION_STORE_TYPE:jdbc}
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE_MB:25}MB
      max-request-size: ${MAX_FILE_SIZE_MB:25}MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

logging:
  level:
    com.verityai: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  correlation:
    key: X-Request-ID

verityai:
  groq:
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:openai/gpt-oss-20b}
    api-url: ${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
    connect-timeout-ms: ${GROQ_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${GROQ_READ_TIMEOUT_MS:60000}
    max-retries: ${GROQ_MAX_RETRIES:2}
    max-tokens: ${GROQ_MAX_TOKENS:4096}
  upload:
    dir: ${UPLOAD_DIR:uploads}
    max-file-size-mb: ${MAX_FILE_SIZE_MB:25}
    max-pages: ${MAX_PAGES:200}
  document:
    chunk-size-chars: ${CHUNK_SIZE_CHARS:1000}
    chunk-overlap-chars: ${CHUNK_OVERLAP_CHARS:150}
  retrieval:
    top-k: ${RETRIEVAL_TOP_K:8}
    min-rank: ${RETRIEVAL_MIN_RANK:0.01}
    # Phase 2: fuse full-text + cosine (RRF); false = keyword-only, identical
    # to pre-Phase-2 retrieval.
    hybrid: ${RETRIEVAL_HYBRID:true}
    rrf-k: ${RETRIEVAL_RRF_K:60}
    min-similarity: ${RETRIEVAL_MIN_SIMILARITY:0.10}
  search:
    max-results: ${SEARCH_MAX_RESULTS:30}
    default-results: ${SEARCH_DEFAULT_RESULTS:20}
  verify:
    # Claim-level citation verification (Feature 6)
    enabled: ${VERIFY_ENABLED:true}
    # Optional dedicated model; empty = chat model
    model: ${VERIFY_MODEL:}
    # Cap on claims analyzed per message (extra claims are reported as unanalyzed)
    max-claims: ${VERIFY_MAX_CLAIMS:25}
    max-tokens: ${VERIFY_MAX_TOKENS:2500}
  knowledge:
    # Deterministic, PostgreSQL-only knowledge graph (Feature 7)
    enabled: ${KNOWLEDGE_GRAPH_ENABLED:true}
    # Cap on documents rebuilt at startup / per explicit rebuild request
    backfill-limit: ${KNOWLEDGE_GRAPH_BACKFILL_LIMIT:20}
    rebuild-max-documents: ${KNOWLEDGE_GRAPH_REBUILD_MAX_DOCUMENTS:10}
    # Bounds on the graph read model returned by the API
    max-nodes: ${KNOWLEDGE_GRAPH_MAX_NODES:300}
    max-edges: ${KNOWLEDGE_GRAPH_MAX_EDGES:4000}
  contradictions:
    # Claim-pair contradiction detection (Feature 8). Explicit, rate-limited runs.
    enabled: ${CONTRADICTION_ENABLED:true}
    # Optional dedicated model; empty = chat model
    model: ${CONTRADICTION_MODEL:}
    # Bounds so one request cannot analyze a whole library or explode model cost
    max-documents: ${CONTRADICTION_MAX_DOCUMENTS:6}
    max-chunks-per-document: ${CONTRADICTION_MAX_CHUNKS_PER_DOCUMENT:12}
    max-claims-per-document: ${CONTRADICTION_MAX_CLAIMS_PER_DOCUMENT:20}
    max-pairs: ${CONTRADICTION_MAX_PAIRS:30}
    max-tokens: ${CONTRADICTION_MAX_TOKENS:3000}
  rate-limit:
    ai-requests-per-minute: ${RATE_LIMIT_AI_REQUESTS_PER_MINUTE:20}
    uploads-per-hour: ${RATE_LIMIT_UPLOADS_PER_HOUR:10}
    login-per-minute-ip: ${RATE_LIMIT_LOGIN_PER_MINUTE_IP:5}
  summary:
    enabled: ${SUMMARY_ENABLED:true}
    # Optional dedicated model for summaries; empty = use GROQ_MODEL
    model: ${SUMMARY_MODEL:}
    # Documents longer than this go through hierarchical segment condensation
    single-pass-chars: ${SUMMARY_SINGLE_PASS_CHARS:48000}
    max-segments: ${SUMMARY_MAX_SEGMENTS:8}
    # Reasoning models (gpt-oss) routinely spend 2000+ tokens reasoning before
    # emitting content — budgets must leave room for that plus the answer.
    max-tokens: ${SUMMARY_MAX_TOKENS:8000}
    segment-max-tokens: ${SUMMARY_SEGMENT_MAX_TOKENS:8000}
    # Cap on automatic backfill jobs per application start
    backfill-limit: ${SUMMARY_BACKFILL_LIMIT:20}
  embeddings:
    # onnx = local model (no external API); off = keyword search only
    provider: ${EMBEDDINGS_PROVIDER:onnx}
    dimensions: 384
    max-input-chars: ${EMBEDDINGS_MAX_INPUT_CHARS:2000}
    # Pinned revision of Xenova/all-MiniLM-L6-v2; checksums verified on every
    # load so a changed upstream file is rejected instead of silently used.
    model-url: https://huggingface.co/Xenova/all-MiniLM-L6-v2/resolve/751bff37182d3f1213fa05d7196b954e230abad9/onnx/model_quantized.onnx
    model-sha256: afdb6f1a0e45b715d0bb9b11772f032c399babd23bfc31fed1c170afc848bdb1
    tokenizer-url: https://huggingface.co/Xenova/all-MiniLM-L6-v2/resolve/751bff37182d3f1213fa05d7196b954e230abad9/tokenizer.json
    tokenizer-sha256: da0e79933b9ed51798a3ae27893d3c5fa4a201126cef75586296df9b4d2c62a0
    cache-dir: ${EMBEDDINGS_CACHE_DIR:${user.home}/.verityai/models}
    connect-timeout-ms: ${EMBEDDINGS_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${EMBEDDINGS_READ_TIMEOUT_MS:60000}
    download-timeout-ms: ${EMBEDDINGS_DOWNLOAD_TIMEOUT_MS:180000}
version: '3.8'

services:
  postgres:
    # pgvector build of PostgreSQL 17 (same major version as before, so the
    # existing postgres_data volume keeps working; vector extension built in)
    image: pgvector/pgvector:0.8.7-pg17
    container_name: verityai-postgres
    environment:
      POSTGRES_DB: verityai
      POSTGRES_USER: verityai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-verityai_dev}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verityai -d verityai"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data: